# CephFS-local read benchmark (issue #258): same as linstor-read-job.yaml but on a
# rook-cephfs RWX PVC — the multi-replica-serving comparison. initContainer copies
# the carbon hex S3/RGW -> PVC once, then DuckDB reads it as LOCAL files (no httpfs,
# no RGW). RWX means (unlike LINSTOR RWO) this same volume could be mounted by the
# 6-replica serve path; here we measure the single-pod read rate for apples-to-apples
# with LINSTOR (2.5s warm) and S3/RGW (77.8s).
#   kubectl apply -f benchmarks/k8s/cephfs-read-job.yaml
#   kubectl logs -l jn=cephfs-read -f --request-timeout=30s
#   kubectl delete job cephfs-read; kubectl delete pvc cephfs-carbon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cephfs-carbon}
spec:
  storageClassName: rook-cephfs            # RWX CephFS (bypasses RGW too; block-vs-fs perf differs)
  accessModes: ["ReadWriteMany"]
  resources: {requests: {storage: 25Gi}}   # carbon hex ~12 GB comp
---
apiVersion: batch/v1
kind: Job
metadata: {name: cephfs-read}
spec:
  completions: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {jn: cephfs-read}}
    spec:
      restartPolicy: Never
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      # Pin compute to us-west so the CephFS-vs-LINSTOR-vs-S3 comparison stays in-region.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/region, operator: In, values: ["us-west"]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cephfs-carbon}
      initContainers:
        - name: copy-from-s3
          image: astral/uv:python3.12-bookworm-slim
          volumeMounts: [{name: data, mountPath: /data}]
          resources:                              # ns LimitRange defaults to 1Gi -> OOMKilled; set explicitly
            requests: {cpu: "4", memory: "4Gi"}
            limits: {cpu: "4", memory: "4Gi"}
          command: ["/bin/sh","-c"]
          args:
            - |
              uv run --with boto3 python3 - <<'PY'
              import os
              from concurrent.futures import ThreadPoolExecutor
              import boto3
              from botocore import UNSIGNED
              from botocore.config import Config
              c=boto3.client("s3",endpoint_url="http://rook-ceph-rgw-nautiluss3.rook",use_ssl=False,
                config=Config(signature_version=UNSIGNED,s3={"addressing_style":"path"},region_name="us-east-1",
                max_pool_connections=64,read_timeout=600))
              B,PRE="public-carbon","vulnerable-carbon-2024/hex/"
              keys=[o["Key"] for pg in c.get_paginator("list_objects_v2").paginate(Bucket=B,Prefix=PRE) for o in pg.get("Contents",[]) if o["Key"].endswith(".parquet")]
              def dl(k):
                  d="/data/"+os.path.dirname(k); os.makedirs(d,exist_ok=True)
                  c.download_file(B,k,"/data/"+k); return 1
              with ThreadPoolExecutor(16) as ex: n=sum(ex.map(dl,keys))
              print(f"copied {n} files to /data/{PRE}",flush=True)
              PY
      containers:
        - name: bench
          image: astral/uv:python3.12-bookworm-slim
          volumeMounts: [{name: data, mountPath: /data}]
          env:
            - {name: MRE_GLOB, value: "/data/vulnerable-carbon-2024/hex/**/*.parquet"}
            - {name: MRE_THREADS, value: "8,16,32,48"}
            - {name: MRE_MEM, value: "8GB"}
          command: ["/bin/sh","-c"]
          args: ["uv run --with duckdb python3 -c \"import urllib.request,runpy; urllib.request.urlretrieve('https://raw.githubusercontent.com/boettiger-lab/mcp-data-server/bench/s3-ceiling/benchmarks/local-read-bench.py','/tmp/b.py'); runpy.run_path('/tmp/b.py',run_name='__main__')\""]
          resources:
            requests: {cpu: "16", memory: "16Gi"}
            limits: {cpu: "16", memory: "16Gi"}
