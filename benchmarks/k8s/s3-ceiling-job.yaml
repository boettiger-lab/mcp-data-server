# S3 read-CEILING benchmark on FAT-CPU pods across multiple us-west nodes.
# Isolates client (boto3) vs RGW vs DuckDB-engine throughput limits. 16 CPU so the
# Python client is never the bottleneck (the 2-CPU s3-throughput-job confound).
#
#   kubectl apply -f benchmarks/k8s/s3-ceiling-job.yaml
#   kubectl logs -l job-name=s3-ceiling -f --max-log-requests=8 --prefix
#   kubectl delete job s3-ceiling
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-ceiling
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        job-name: s3-ceiling
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values: ["true"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  job-name: s3-ceiling
              topologyKey: kubernetes.io/hostname
      containers:
      - name: bench
        image: astral/uv:python3.12-bookworm-slim
        env:
          - name: NODE_NAME
            valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
        command: ["/bin/sh", "-c"]
        args:
          - |
            uv run --with boto3 --with duckdb python3 - << 'PYEOF'
            import urllib.request, runpy
            RAW = ("https://raw.githubusercontent.com/boettiger-lab/"
                   "mcp-data-server/bench/s3-ceiling/benchmarks/s3-ceiling-bench.py")
            urllib.request.urlretrieve(RAW, "/tmp/bench.py")
            runpy.run_path("/tmp/bench.py", run_name="__main__")
            PYEOF
        resources:
          requests: {cpu: "16", memory: "16Gi"}
          limits:   {cpu: "16", memory: "16Gi"}
