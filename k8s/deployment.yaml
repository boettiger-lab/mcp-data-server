apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: biodiversity
spec:
  replicas: 6
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      containers:
      - name: server
        image: ghcr.io/boettiger-lab/mcp-data-server:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            git clone --branch v0.6.3 https://github.com/boettiger-lab/mcp-data-server.git /app && \
            cd /app && \
            python server.py
        env:
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://duckdb-mcp.nrp-nautilus.io"
        resources:
          # Requests intentionally kept small (≤2 GiB memory, ≤1 CPU) to land in
          # NRP's "Ignored" bucket for utilization violations. Limits stay high so
          # legitimate large queries (~100 GiB memory, multi-CPU) can still burst.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 160Gi
            cpu: 64
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 5

