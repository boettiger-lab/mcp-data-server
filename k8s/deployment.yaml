apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: biodiversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      containers:
      - name: server
        image: ghcr.io/boettiger-lab/mcp-data-server:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            git clone --branch v0.5.4 https://github.com/boettiger-lab/mcp-data-server.git /app && \
            cd /app && \
            python server.py
        env:
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://duckdb-mcp.nrp-nautilus.io"
        resources:   
          requests:
            memory: 16Gi
            cpu: 1
          limits: 
            memory: 160Gi
            cpu: 16
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 5

