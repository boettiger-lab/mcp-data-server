apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: biodiversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      containers:
      - name: server
        image: astral/uv:python3.12-bookworm-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update && apt-get install -y git && \
            git clone --branch v0.4.0 https://github.com/boettiger-lab/mcp-data-server.git /app && \
            cd /app && \
            uv run --with "mcp" --with "duckdb" --with pandas --with uvicorn --with tabulate --with pystac --with requests server.py
        env:
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://duckdb-mcp.nrp-nautilus.io"
        resources:   
          requests:
            memory: 16Gi
            cpu: 1
          limits: 
            memory: 160Gi
            cpu: 16
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15  # Give 'uv' time to install deps
          periodSeconds: 5
          failureThreshold: 5

