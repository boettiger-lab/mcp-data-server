apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-mcp
  namespace: biodiversity
spec:
  replicas: 6
  selector:
    matchLabels:
      app: duckdb-mcp
  template:
    metadata:
      labels:
        app: duckdb-mcp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      containers:
      - name: server
        image: ghcr.io/boettiger-lab/mcp-data-server:v0.9.0@sha256:84c62dab4064b881be2c3020ca5045ff516231b015f3dedf0ad7cb3e9e140beb
        imagePullPolicy: IfNotPresent
        env:
        # Release identity is supplied HERE, not baked into the image (#413). The
        # image is built once from `main` and a release only adds a tag to that
        # existing manifest — so its own ENV still says "main", and this overrides
        # it. Keep this in step with the `:vX.Y.Z` in `image:` above; CI enforces
        # that they match (tests/check_k8s_image_pins.py). GIT_SHA is NOT overridden:
        # the image's own value is the commit it was built from, which stays correct
        # through a retag.
        - name: APP_VERSION
          value: "v0.9.0"
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://duckdb-mcp.nrp-nautilus.io"
        # Pod's cgroup memory limit → DuckDB memory_limit (~80%), so an oversized
        # query spills to /tmp instead of OOM-killing the replica and every
        # co-tenant query on it (#270).
        - name: POD_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.memory
        # Container's ephemeral-storage limit (unset here, so the namespace
        # LimitRange default — 50Gi on NRP) → DuckDB max_temp_directory_size (~50%
        # per connection), so an oversized spill fails its query instead of the
        # kubelet evicting the pod (#423).
        - name: POD_EPHEMERAL_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.ephemeral-storage
        resources:
          # Requests intentionally kept small (≤2 GiB memory, ≤1 CPU) to land in
          # NRP's "Ignored" bucket for utilization violations. Limits stay high so
          # legitimate large queries (~100 GiB memory, multi-CPU) can still burst.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 160Gi
            cpu: 64
        ports:
        - containerPort: 8000
        # Probes exercise an actual HTTP request (GET /healthz) rather than a
        # bare TCP accept. Under a TCP-only probe a pod whose uvicorn event loop
        # is starved (e.g. by a runaway DuckDB query saturating CPU/memory) still
        # passes — the kernel accepts the connection regardless of whether the
        # app writes a response — and HAProxy keeps routing ~50% of traffic to a
        # wedged backend. See issue #157.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        # Liveness restarts a chronically wedged pod (3 minutes of unresponsive
        # /healthz). Longer than readiness so a temporarily slow pod gets pulled
        # from the Service first; only a deeply stuck one is killed.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6

