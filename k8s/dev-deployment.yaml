apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-duckdb-mcp
  namespace: biodiversity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-duckdb-mcp
  template:
    metadata:
      labels:
        app: dev-duckdb-mcp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
      containers:
      - name: server
        # ⚠️ THIS DIGEST IS A FLOOR, NOT A RECORD OF WHAT DEV IS RUNNING (#406).
        # .github/workflows/deploy-dev.yml converges dev after every successful
        # :main build by patching the live Deployment (kubectl set image); it does
        # NOT commit back here, so this value lags the cluster by design. To learn
        # what dev actually serves, ask the cluster:
        #   kubectl -n biodiversity get deploy dev-duckdb-mcp \
        #     -o jsonpath='{.spec.template.spec.containers[0].image}'
        # Do not "fix" the drift by hand-rolling dev — see AGENTS.md → Rollout
        # workflow. (Prod is the opposite: k8s/deployment.yaml IS authoritative,
        # because prod is promoted deliberately per release.)
        #
        # Pinned by digest (not the moving :main tag) so every dev pod converges
        # on one reproducible build. :main + imagePullPolicy: Always is
        # non-convergent: Always re-resolves the mutable :main → digest
        # independently per pod at each (re)start, so pods brought up seconds
        # apart — or a single later liveness/eviction/cron restart — silently
        # drift onto different builds with no signal, exactly the cross-pod skew
        # dev's ≥2 replicas exist to catch. The tag prefix is for humans; the
        # digest is enforced. See issue #341.
        image: ghcr.io/boettiger-lab/mcp-data-server:main@sha256:dd626e6f0830ed0423016ab1356b3118a94205ede25ae2f725ae161bdc324ea6
        imagePullPolicy: IfNotPresent
        env:
        - name: STAC_CATALOG_URL
          value: "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json"
        - name: MCP_PUBLIC_BASE_URL
          value: "https://dev-duckdb-mcp.nrp-nautilus.io"
        # Boot even if the Ceph STAC catalog is unreachable at startup, so the
        # server can serve the source.coop mirror during a Ceph outage (#260).
        # Discovery is empty until Ceph returns; known/inline datasets still work.
        # Dev-only for now; prod keeps the default fail-fast until proven out.
        - name: STAC_ALLOW_DEGRADED_START
          value: "true"
        # Pod's cgroup memory limit → DuckDB memory_limit (~80%), so an oversized
        # query spills to /tmp instead of OOM-killing the replica and every
        # co-tenant query on it (#270).
        - name: POD_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: server
              resource: limits.memory
        resources:
          # Requests intentionally kept small (≤2 GiB memory, ≤1 CPU) to land in
          # NRP's "Ignored" bucket for utilization violations. Limits stay high so
          # legitimate large queries (~100 GiB memory, multi-CPU) can still burst.
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 160Gi
            cpu: 64
        ports:
        - containerPort: 8000
        # Probes exercise an actual HTTP request (GET /healthz) rather than a
        # bare TCP accept. Under a TCP-only probe a pod whose uvicorn event loop
        # is starved (e.g. by a runaway DuckDB query saturating CPU/memory) still
        # passes — the kernel accepts the connection regardless of whether the
        # app writes a response — and HAProxy keeps routing ~50% of traffic to a
        # wedged backend. See issue #157.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        # Liveness restarts a chronically wedged pod (3 minutes of unresponsive
        # /healthz). Longer than readiness so a temporarily slow pod gets pulled
        # from the Service first; only a deeply stuck one is killed.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
